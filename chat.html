<script>
(function(){
  var WEBHOOK="https://the303photography.app.n8n.cloud/webhook/recepcionista-structure";
  var WHATSAPP="https://wa.me/13475004037";
  var GREETING="Hi! I'm Sofia from Structure. Want help choosing your service and barber to book?";
  var sid; try{sid=sessionStorage.getItem('rc-sid')||('web-'+Math.random().toString(36).slice(2));sessionStorage.setItem('rc-sid',sid);}catch(e){sid='web-'+Math.random().toString(36).slice(2);}
  var msgs=document.getElementById('msgs'),form=document.getElementById('form'),input=document.getElementById('in');
  function add(t,who){var d=document.createElement('div');d.className='m '+(who==='me'?'me':'bot');d.textContent=t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;}
  add(GREETING,'bot');input.focus();
  form.onsubmit=function(e){e.preventDefault();var t=input.value.trim();if(!t)return;add(t,'me');input.value='';input.disabled=true;
    var typing=document.createElement('div');typing.className='m bot';typing.textContent='...';msgs.appendChild(typing);msgs.scrollTop=msgs.scrollHeight;
    function done(){input.disabled=false;input.focus();}
    fetch(WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t,sessionId:sid,source:'web-structure-chatpage'})})
      .then(function(r){return r.json();}).then(function(d){typing.remove();add((d&&(d.reply||d.output||d.text))||'Got it, one moment...','bot');done();})
      .catch(function(){typing.remove();var m=document.createElement('div');m.className='m bot';m.appendChild(document.createTextNode("I can't reply here right now. Message us on WhatsApp: "));var a=document.createElement('a');a.href=WHATSAPP;a.target='_blank';a.rel='noopener';a.style.color='#B89A6A';a.textContent='Open WhatsApp';m.appendChild(a);msgs.appendChild(m);msgs.scrollTop=msgs.scrollHeight;done();});
  };
})();
</script>
